version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: dms_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: kreatif_dms
    ports:
      - "5432:5432"
    volumes:
      - dms_pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - dms_network

  redis:
    image: redis:7-alpine
    container_name: dms_redis
    ports:
      - "6379:6379"
    volumes:
      - dms_redisdata:/data
    restart: unless-stopped
    networks:
      - dms_network

  minio:
    image: quay.io/minio/minio
    container_name: dms_minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: secretpassword
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - dms_miniodata:/data
    restart: unless-stopped
    networks:
      - dms_network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: dms_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms256m -Xmx256m"
    deploy:
      resources:
        limits:
          memory: 512M
    ports:
      - "9200:9200"
    volumes:
      - dms_esdata:/usr/share/elasticsearch/data
    restart: unless-stopped
    networks:
      - dms_network

networks:
  dms_network:
    driver: bridge

volumes:
  dms_pgdata:
  dms_redisdata:
  dms_miniodata:
  dms_esdata:
