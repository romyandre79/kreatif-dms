version: "2"
sql:
  - schema: "db/migrations"
    queries: "db/queries"
    engine: "postgresql"
    gen:
      go:
        package: "repository"
        out: "internal/repository"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: false
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - column: "documents.metadata"
            go_type:
              import: "encoding/json"
              type: "RawMessage"
          - column: "ocr_jobs.words_json"
            go_type:
              import: "encoding/json"
              type: "RawMessage"
          - column: "ocr_jobs.ai_metadata"
            go_type:
              import: "encoding/json"
              type: "RawMessage"
          - column: "email_templates.placeholders"
            go_type:
              import: "encoding/json"
              type: "RawMessage"
