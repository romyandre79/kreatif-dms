host: localhost:8080
info:
  contact:
    email: romy@kreatif.id
    name: API Support
  description: API for Document Management System with AI and RFID support.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Kreatif DMS API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Login with email and password to get JWT tokens
      parameters:
      - description: Login Credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_kreatif_dms-backend_pkg_response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_kreatif_dms-backend_internal_service.LoginResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_kreatif_dms-backend_pkg_response.APIResponse'
      summary: Login user
      tags:
      - Auth
  /batches:
    post:
      description: Start a new batch for multiple uploads
      parameters:
      - description: Total files in batch
        in: body
        name: total_files
        required: true
        schema:
          type: integer
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_kreatif_dms-backend_internal_repository.ProcessingBatch'
      summary: Create Batch
      tags:
      - Batches
  /batches/{id}:
    get:
      description: Get progress and individual file status for a batch
      parameters:
      - description: Batch ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_kreatif_dms-backend_internal_service.BatchDetails'
      summary: Get Batch Status
      tags:
      - Batches
  /master/boxes:
    get:
      consumes:
      - application/json
      description: Fetch all boxes globally
