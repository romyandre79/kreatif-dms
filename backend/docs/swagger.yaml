                  type: array
              type: object
      security:
      - BearerAuth: []
      summary: List all boxes
      tags:
      - Master
    post:
      consumes:
      - application/json
      description: Create a new box record
      parameters:
      - description: Box details
        in: body
        name: request
        required: true
        schema:
