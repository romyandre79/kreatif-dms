basePath: /api/v1
host: localhost:8080
info:
  contact:
    email: romy@kreatif.id
    name: API Support
  description: API for Document Management System with AI and RFID support.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Kreatif DMS API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Login with email and password to get JWT tokens
      parameters:
      - description: Login Credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Login successful
          schema:
            $ref: '#/definitions/response.APIResponse'
        "401":
          description: Login failed
          schema:
            $ref: '#/definitions/response.APIResponse'
      summary: Login user
      tags:
      - Auth
definitions:
  handler.loginRequest:
    properties:
      auth_type:
        description: '"sso" or "local"'
        type: string
      identifier:
        type: string
      password:
        type: string
    required:
    - identifier
    - password
    type: object
  response.APIResponse:
    properties:
      data:
        type: object
      message:
        type: string
      status:
        type: integer
    type: object
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
